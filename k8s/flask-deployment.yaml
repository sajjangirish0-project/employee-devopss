apiVersion: apps/v1
kind: Deployment

metadata:
  name: flask-deployment

spec:

  replicas: 2

  selector:
    matchLabels:
      app: flask

  template:

    metadata:
      labels:
        app: flask

    spec:

      containers:

        - name: flask

          image: employee-api:1.0

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000

          resources:

            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:

            httpGet:
              path: /health
              port: 5000

            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:

            httpGet:
              path: /health
              port: 5000

            initialDelaySeconds: 10
            periodSeconds: 20